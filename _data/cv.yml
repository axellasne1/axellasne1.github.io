cv:
  name: Axel Lasne
  label: Aerospace Verification Engineer — HIL, Systems Test & Flight-Test Mindset
  address:
    city: Munich
    region: Germany
  email: axel.lasne@estaca.eu
  summary: >-
    Aerospace verification engineer focused on hardware-in-the-loop (HIL)
    validation, embedded systems testing, and Python test automation. Private
    pilot bringing a practical flight perspective to systems verification.
  sections:
    Education:
      - institution: ESTACA
        area: Aeronautical Engineering - Propulsion Systems and Onboard Energies
        studyType: M.Eng.
        location: France
        start_date: 2017
        end_date: 2024

    Experience:
      - company: Avilus
        position: Verification Engineer (Hardware in the Loop)
        location: Munich, Germany
        start_date: 2025-12
        end_date: present
        highlights:
          - Conduct HIL bench testing and real-time simulation to validate embedded systems under representative operating conditions.
          - Design functional and edge-case test scenarios, collect evidence, and analyse compliance against expected requirements.
          - Assess combined effects of defects and escalate integrity risks before aircraft handover to pilots.
          - Support release-readiness evidence, including fit-for-flight sign-off documentation.
          - Contribute to Python-based test automation and controlled test-equipment update workflows.
      - company: Technology & Strategy
        position: System Test Engineer
        location: Frankfurt, Germany
        start_date: 2024-03
        end_date: 2025-11
        highlights:
          - Validated vehicle systems and configurations supporting advanced software functions.
          - Performed track testing aligned with European standards, including Euro NCAP protocols.
          - Produced test reports, managed defect tickets, and contributed to 33 percent of the team's resolved tickets.
          - Analysed the end-to-end test process, introduced Python automation for logs and software flashing, and improved efficiency by 50 percent in six months.
          - Helped scale the team to ten colleagues and coordinated test activity and the vehicle fleet.
      - company: Climairtec
        position: Project Manager
        location: Chateau-Landon, France
        start_date: 2023-11
        end_date: 2024-02
        highlights:
          - Supported technical client problem-solving, project design in AutoCAD, and aerodynamic and hydraulic loss calculations.
          - Contributed to invoicing preparation for customer projects valued above EUR 1 million.
      - company: ETS Montreal
        position: Engineering Research Intern
        location: Montreal, Canada
        start_date: 2023-03
        end_date: 2023-11
        highlights:
          - Modelled General Electric engine fuel consumption and component deterioration using aerothermodynamic equations.
          - Validated predictions within 5 percent of real-world data using CAE tools and MATLAB.
          - Presented the technical report at a PhD-level conference.
      - company: Centauri Aircraft Corporation
        position: Manufacturing Engineer Intern
        location: San Francisco, USA
        start_date: 2021-09
        end_date: 2022-09
        highlights:
          - Contributed to composite airframe construction, aircraft maintenance, production tooling, and FAA certification activity.
          - Supported sourcing, inventory, and supplier research; trained colleagues and independently managed work streams.
      - company: Mecachrome
        position: Project Management and Quality Engineer Intern
        location: Amboise, France
        start_date: 2021-05
        end_date: 2021-09
        highlights:
          - Supported APQP deployment for the Airbus A220 NLGB project and facilitated a Lean Office workshop.

